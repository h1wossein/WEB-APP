function viewer(i,ls){ls=ls||U.stories;if(!ls.length)return;let k=i;const o=document.createElement("div");o.className="vw";document.body.append(o);
const end=()=>{o.remove();render()},go=d=>{k+=d;if(k>=ls.length)return end();if(k<0)k=0;show()};

const vc=o.querySelector(".vc"),an=o.querySelector(".an");let y0=0,t0=0;

function edText(e,cb,host){const p=document.createElement("div");p.className="tpn";host.append(p);

<div class="ecv"><div class="cvw" id="cv">${sHTML(d)}<div class="tr" id="tr">🗑</div></div></div>

g("#ee").onclick=()=>{const s=sheet(`<div class="emg">${EM.map(e=>`<button>${e}</button>`).join("")}</div>`);s.querySelectorAll("button").forEach(b=>b.onclick=()=>{s.remove();add({k:"e",v:b.textContent,x:50,y:50,fs:16})})};
g("#em").onclick=()=>{const s=sheet(`<input class="f" id="ms2" placeholder="${t("song2")}"><button class="btn" id="ok2">${t("add")}</button>`);s.querySelector("#ok2").onclick=()=>{const v=s.querySelector("#ms2").value.trim();if(v){s.remove();add({k:"m",v:v,x:50,y:85})}}};

o.querySelectorAll("[data-fl]").forEach(b=>b.onclick=()=>{d.fl=+b.dataset.fl;draw()});o.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{d.bg=+b.dataset.bg;draw()});
g("#eh").onclick=()=>{d.hl=d.hl?0:1;draw()};
g("#es").onclick=()=>{if(!d.els.length&&!d.img)return toast(t("typehere"));U.stories.push({id:Date.now(),ts:Date.now(),bg:d.bg,img:d.img,fl:d.fl,els:d.els,hl:d.hl});save();o.remove();toast(t("done"));render()};
cv.querySelectorAll(".el").forEach(el=>{el.style.touchAction="none";el.onpointerdown=ev=>{ev.preventDefault();const i=+el.dataset.i,e=d.els[i],r=cv.getBoundingClientRect();let mv=0;el.setPointerCapture(ev.pointerId);tr.classList.add("show");
el.onpointermove=m=>{mv=1;e.x=Math.max(0,Math.min(100,(m.clientX-r.left)/r.width*100));e.y=Math.max(0,Math.min(100,(m.clientY-r.top)/r.height*100));el.style.left=e.x+"%";el.style.top=e.y+"%";tr.classList.toggle("hot",e.y>90)};
el.onpointerup=()=>{tr.classList.remove("show","hot");el.onpointermove=null;if(!mv){if(e.k=="t")edText(e,()=>done(e),o)}else if(e.y>90){d.els.splice(i,1);draw()}}}})};draw()}
function compose(m0){if(m0=="story")return editor();let m=m0||"note",d={bg:0,tx:"",img:"",fs:28,song:""};const o=sheet("");
const draw=()=>{const h=[`<div class="tp">${["note","music","story"].map(k=>`<button data-k="${k}" class="${m==k?"on":""}">${{note:"💬 "+t("note"),music:"🎵 "+t("music"),story:"◎ "+t("story")}[k]}</button>`).join("")}</div>`];
if(m=="note")h.push(`<input class="f" id="a" maxlength="60" placeholder="${t("notet")}" value="${esc(U.note?U.note.tx:"")}">`);
else if(m=="music"){const p=(U.song?U.song.tx:"").split(" – ");h.push(`<input class="f" id="a" placeholder="${t("song")}" value="${esc(p[0])}"><input class="f" id="b" placeholder="${t("artist")}" value="${esc(p[1]||"")}" style="margin-top:8px">`)}
else h.push(`<div class="pv" style="background:${d.img?`#000 url(${d.img}) center/contain no-repeat`:GR[d.bg]}"><span id="pt" style="font-size:${d.fs}px">${esc(d.tx)}</span></div><textarea class="f" id="a" rows="2" placeholder="${t("storyt")}">${esc(d.tx)}</textarea><div class="sw" style="margin:10px 0">${GR.map((g,i)=>`<button data-bg="${i}" style="background:${g}" class="${d.bg==i&&!d.img?"on":""}"></button>`).join("")}</div><div style="display:flex;gap:8px"><button class="chip on" id="ph1">🖼 ${t("photo")}</button><button class="chip" id="fm">A−</button><button class="chip" id="fp">A+</button></div><input class="f" id="b" placeholder="🎵 ${t("music")}" value="${esc(d.song)}" style="margin-top:8px">`);
h.push(`<p class="mu" style="margin:8px 0">${t("h24")}</p><button class="btn" id="ok">${t("post")}</button>${m!="story"&&(m=="note"?U.note:U.song)?`<button class="btn" id="rm" style="background:var(--ob);color:#e55">${t("remove")}</button>`:""}`);
o.firstChild.innerHTML=h.join("");const g=s=>o.querySelector(s),a=g("#a");

if(m=="story"){a.oninput=()=>{d.tx=a.value;g("#pt").textContent=a.value};g("#b").oninput=e=>d.song=e.target.value;o.querySelectorAll("[data-bg]").forEach(b=>b.onclick=()=>{d.bg=+b.dataset.bg;d.img="";draw()});g("#ph1").onclick=()=>pick(900,x=>{d.img=x;draw()});g("#fm").onclick=()=>{d.fs=Math.max(16,d.fs-4);draw()};g("#fp").onclick=()=>{d.fs=Math.min(48,d.fs+4);draw()}}
g("#ok").onclick=()=>{const v=a.value.trim(),b=g("#b")?g("#b").value.trim():"";
if(m=="note")U.note=v?{tx:v,ts:Date.now()}:null;
else if(m=="music")U.song=v?{tx:b?v+" – "+b:v,ts:Date.now()}:null;
else{if(!v&&!d.img)return toast(t("storyt"));U.stories.push({id:Date.now(),ts:Date.now(),tx:v,bg:d.bg,img:d.img,fs:d.fs,song:d.song.trim()})}
save();o.remove();toast(t("done"));render()};
const rm=g("#rm");if(rm)rm.onclick=()=>{U[m=="note"?"note":"song"]=null;save();o.remove();render()}};draw()}
function contacts(){const o=sheet("");const draw=()=>{o.firstChild.innerHTML=`<h2 style="margin-bottom:8px">${t("contacts")}</h2>${U.ct.filter(c=>!c.saved).map(c=>`<div class="row" data-o="${c.id}" style="padding-inline:0">${av(c.n,"")}<div class="m"><b>${esc(c.n)}</b><p dir="ltr" style="text-align:start">${esc(c.ph)}</p></div></div>`).join("")||`<p class="mu" style="padding:10px 0">${t("noct")}</p>`}<h3 style="margin:14px 0 4px;font-size:13px;color:var(--ac)">${t("newc")}</h3><input class="f" id="cn" placeholder="${t("name")}"><input class="f" id="cp" type="tel" placeholder="${t("phone")}" style="direction:ltr;margin-top:8px"><button class="btn" id="ca">${t("add")}</button><p class="mu" style="margin-top:10px">${t("demo")}</p>`;

function settings(){const o=document.createElement("div");o.className="full";document.body.append(o);let pg="main";
const PG=[["acc","👤"],["chat","💬"],["notif","🔔"],["priv","🔒"],["data","🗂"],["appear","🎨"],["folders","📁"],["lang","🌐"],["stset","◎"],["dev","💻"],["about","ℹ️"]];
const tg=(k,l)=>`<div class="fl"><span>${t(l)}</span><button class="tg ${sv(k)?"on":""}" data-g="${k}"></button></div>`,
seg=(k,l,op)=>`<div class="fl" style="display:block"><span>${t(l)}</span><div class="seg" style="margin-top:8px">${op.map(([v,x])=>`<button data-sg="${k}|${v}" class="${sv(k)==v?"on":""}">${t(x)}</button>`).join("")}</div></div>`,
rg=(k,l,a,b)=>`<div class="fl"><span>${t(l)}</span><input type="range" min="${a}" max="${b}" value="${k=="fs"?G.fs:sv(k)}" data-r="${k}"></div>`,
inp=(k,l,v)=>`<div class="fl"><label>${t(l)}<input type="text" data-p="${k}" value="${esc(v)}"></label></div>`,
bt=(id,l,c)=>`<div class="fl"><button id="${id}" style="${c?"color:#e55":""}">${t(l)}</button></div>`;
const P={
main:()=>`<div class="card" style="text-align:center;padding:22px 14px"><div id="pp" style="cursor:pointer">${av(U.name,U.photo,"big")}</div><b style="font-size:19px">${esc(U.name)}</b><div class="mu" dir="ltr">${esc(U.phone)} · @${esc(U.user)}</div></div><div class="card">${PG.map(([k,i])=>`<div class="fl nv" data-pg="${k}"><span>${i} &nbsp;${t(k)}</span><span class="mu">${rtl()?"‹":"›"}</span></div>`).join("")}</div>`,

chat:()=>`<div class="card"><div class="msgs w${sv("wall")}" style="height:130px;border-radius:14px;margin:10px 0"><div class="b">${t("typemsg")}</div><div class="b me">${t("bubble")}</div></div>${rg("fs","fsize",13,20)}${rg("br","bubble",6,28)}<div class="fl"><span>${t("wall")}</span><div class="sw">${[0,1,2,3].map(i=>`<button data-w="${i}" class="msgs w${i} ${sv("wall")==i?"on":""}" style="border:1px solid var(--ln);padding:0"></button>`).join("")}</div></div></div>`,

data:()=>`<div class="card">${tg("autodl","autodl")}<div class="fl"><span>${t("storage")}</span><b>${Math.round(JSON.stringify(D).length/1024)} KB</b></div>${bt("cs","clearst",1)}${bt("cc2","clearch",1)}</div>`,
appear:()=>`<div class="card"><div class="fl"><div class="seg" style="width:100%">${["auto","light","dark"].map(k=>`<button data-th="${k}" class="${G.theme==k?"on":""}">${t(k)}</button>`).join("")}</div></div><div class="fl"><span>${t("accent")}</span><div class="sw">${COL.map(c=>`<button data-ac="${c}" style="background:${c}" class="${G.ac==c?"on":""}"></button>`).join("")}</div></div></div>`,
folders:()=>`<div class="card">${U.folders.map((f,i)=>`<div class="fl"><span>📁 ${esc(f)}</span><button data-df="${i}" style="color:#e55">${t("remove")}</button></div>`).join("")}<div class="fl"><input type="text" id="nf" placeholder="${t("addf")}"><button class="ib" id="af">+</button></div></div>`,
lang:()=>`<div class="card">${Object.keys(L).map(k=>`<div class="fl nv" data-l="${k}"><span>${L[k].n}</span><b>${G.lang==k?"✓":""}</b></div>`).join("")}</div>`,

const g=s=>o.querySelector(s),all=s=>o.querySelectorAll(s);

all("[data-ac]").forEach(b=>b.onclick=()=>{G.ac=b.dataset.ac;save();apply();draw()});
all("[data-l]").forEach(b=>b.onclick=()=>{G.lang=b.dataset.l;save();apply();draw()});

render();
</script></body></html>
